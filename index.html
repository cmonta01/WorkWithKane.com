  <style>
    :root {
      --navy: #0B2C59;
      --blue: #1565A8;
      --blue-light: #EBF3FA;
      --bg: #F4F7FA;
      --surface: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --success: #15803D;
      --error: #B91C1C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--navy);
    }

    .brand-title span {
      color: var(--blue);
    }

    .brand-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .header-cta {
      font-size: 14px;
      font-weight: 700;
      color: var(--navy);
      text-decoration: none;
      background: var(--blue-light);
      padding: 9px 14px;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    .header-cta:hover {
      background: #DCEAF7;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 36px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .container {
        padding-top: 28px;
      }
    }

    .badge {
      display: inline-block;
      background: var(--blue-light);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .lead-copy {
      font-size: 16px;
      color: #475569;
      margin-bottom: 28px;
    }

    .pillars {
      display: grid;
      gap: 14px;
      margin-bottom: 28px;
    }

      padding: 16px 18px;

      gap: 14px;
      align-items: flex-start;
    }
