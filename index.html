<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwKafcvEZTqkqsorUo6Qkf8wupFDIi_-AsrzERK4swhefqyYK9Y2-RB-CM7OppG9FZn/exec";
    const form = document.getElementById("leadForm");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Sending...";
      statusEl.textContent = "";

      const params = new URLSearchParams();
      params.append("name", document.getElementById("name").value.trim());
      params.append("phone", document.getElementById("phone").value.trim());
      params.append("address", document.getElementById("address").value.trim());
      params.append("notes", document.getElementById("notes").value.trim());

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: params
        });
        statusEl.style.color = "#4ade80";
        statusEl.textContent = "Received! Kane will reach out shortly.";
        form.reset();
      } catch (err) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Something went wrong. Please try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Property Info";
      }
    });
  </script>
  </script>
</body>
</html>
